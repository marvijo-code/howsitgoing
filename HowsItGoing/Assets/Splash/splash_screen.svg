<?xml version="1.0" encoding="UTF-8"?>
<svg width="450" height="450" viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="front-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <g transform="translate(65, 90)">
    <!-- Back speech bubble (Purple) -->
    <g filter="url(#shadow)">
      <rect x="120" y="20" width="180" height="120" rx="36" fill="url(#back-grad)" />
      <path d="M 260,140 L 260,180 L 220,140 Z" fill="url(#back-grad)" />
      
      <!-- Dots -->
      <circle cx="165" cy="80" r="8" fill="#FFFFFF" opacity="0.8" />
      <circle cx="210" cy="80" r="8" fill="#FFFFFF" opacity="0.8" />
      <circle cx="255" cy="80" r="8" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Front speech bubble (Blue) -->
    <g filter="url(#shadow)">
      <rect x="20" y="90" width="180" height="120" rx="36" fill="url(#front-grad)" />
      <path d="M 60,210 L 60,250 L 100,210 Z" fill="url(#front-grad)" />
      
      <!-- Smile -->
      <path d="M 70,145 Q 110,185 150,145" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    </g>
  </g>
</svg>